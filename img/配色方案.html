<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>媒体小工具 · 配色方案</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif; }
  svg { display:block; }
  .mock { width:1280px; height:800px; overflow:hidden; display:flex; position:relative; }

  /* ---------- 侧边栏 ---------- */
  .side {
    width:200px; flex:none; height:800px; display:flex; flex-direction:column;
    background:var(--side); border-right:1px solid var(--side-brd);
  }
  .navlab { font-size:11px; letter-spacing:3px; color:var(--navlab); padding:18px 22px 8px; }
  nav { padding:0 10px; display:flex; flex-direction:column; gap:3px; }
  .ni {
    height:41px; display:flex; align-items:center; gap:11px; padding:0 12px;
    border-radius:10px; color:var(--nav); font-size:13.5px; border:1px solid transparent;
  }
  .ni svg { flex:none; }
  .ni.on {
    color:var(--nav-act); font-weight:600;
    background:var(--nav-act-bg); border-color:var(--nav-act-brd);
  }
  .sidefoot { margin-top:auto; padding:10px 10px 14px; }
  .about {
    width:100%; height:30px; border-radius:8px; font-size:12.5px; font-family:inherit;
    background:var(--about-bg); color:var(--about-text); border:1px solid var(--about-brd);
  }

  /* ---------- 主区 ---------- */
  .main { flex:1; min-width:0; background:var(--page); display:flex; flex-direction:column; }
  header { padding:14px 20px 0; display:flex; justify-content:space-between; align-items:flex-start; }
  h1 { font-size:18px; color:var(--ink); }
  .desc { font-size:11.5px; color:var(--muted); margin-top:4px; }
  .chip {
    display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600; white-space:nowrap;
    color:var(--chip-text); background:var(--chip-bg); border:1px solid var(--chip-brd);
    border-radius:999px; padding:4px 12px;
  }
  .chip .dot { width:6px; height:6px; border-radius:50%; background:var(--ok); }
  .content { flex:1; min-height:0; display:flex; gap:14px; padding:12px 20px 16px; }
  .left { flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }

  .card {
    background:var(--card); border:1px solid var(--card-brd); border-radius:14px;
  }
  .chead { display:flex; align-items:center; justify-content:space-between; }
  .chead b { font-size:14px; color:var(--ink); }
  .hint { font-size:11px; color:var(--faint); }

  .input { padding:12px 14px; }
  .input .chead { margin-bottom:10px; }
  .irow { display:flex; gap:10px; }
  .field {
    flex:1; min-width:0; height:32px; display:flex; align-items:center; gap:9px; padding:0 12px;
    background:var(--field-bg); border:1px solid var(--field-brd); border-radius:8px;
    color:var(--ink); font-size:13px;
  }
  .field .ellip { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .field svg { color:var(--faint); flex:none; }
  .soft {
    height:32px; padding:0 16px; border:none; border-radius:8px; flex:none; cursor:default;
    background:var(--soft-bg); color:var(--soft-text); font-size:13px; font-weight:600; font-family:inherit;
  }

  .param { padding:12px 14px; }
  .param .chead { margin-bottom:10px; }
  .prow { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .prow:last-child { margin-bottom:0; }
  .prow > label { width:40px; flex:none; font-size:12.5px; color:var(--muted); font-weight:600; }
  .sel { justify-content:space-between; }
  .seg {
    display:flex; gap:2px; background:var(--seg-bg); border-radius:12px; padding:3px;
  }
  .seg span { padding:4px 12px; border-radius:9px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .seg span.on { background:var(--card); color:var(--soft-text); font-weight:600; }
  .seg.fmt { flex:1; }
  .seg.fmt span { flex:1; text-align:center; padding:5px 0; }
  .vol { flex:1; display:flex; align-items:center; gap:12px; }
  .slider { position:relative; flex:1; height:6px; border-radius:3px; background:var(--track); }
  .slider .fill { position:absolute; left:0; top:0; bottom:0; width:50%; border-radius:3px; background:var(--accent); }
  .slider .thumb {
    position:absolute; left:50%; top:50%; width:10px; height:14px; border-radius:3px;
    transform:translate(-50%,-50%); background:var(--accent);
  }
  .vval {
    flex:none; min-width:40px; text-align:center; padding:3px 0; border-radius:6px;
    background:var(--soft-bg); color:var(--soft-text); font-size:12px; font-weight:700;
  }

  .prog { display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .okic {
    width:28px; height:28px; flex:none; border-radius:50%;
    background:var(--soft-bg); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .pmain { flex:1; min-width:0; }
  .ptop { display:flex; justify-content:space-between; margin-bottom:6px; }
  .ptext { font-size:12.5px; font-weight:600; color:var(--ink); }
  .ppct { font-size:12px; font-weight:700; color:var(--accent); }
  .bar { height:8px; border-radius:4px; background:var(--track); overflow:hidden; }
  .bfill { height:100%; width:100%; border-radius:4px; background:var(--accent); }
  .primary {
    height:28px; padding:0 18px; border:none; border-radius:8px; flex:none; cursor:default;
    background:var(--accent); color:var(--on-accent); font-size:13px; font-weight:700; font-family:inherit;
  }
  .ghost {
    height:28px; padding:0 14px; border-radius:8px; flex:none; cursor:default;
    background:var(--card); color:var(--muted); border:1px solid var(--card-brd);
    font-size:13px; font-family:inherit;
  }
  .ghost.dis { opacity:.5; }

  .results { flex:1; min-height:0; display:flex; flex-direction:column; padding:10px 14px; }
  .results .chead { margin-bottom:4px; }
  .ghost.sm { height:24px; padding:0 10px; font-size:11.5px; display:flex; align-items:center; gap:5px; }
  table { width:100%; border-collapse:collapse; }
  th {
    text-align:left; font-size:11px; font-weight:600; color:var(--faint);
    padding:6px 8px; border-bottom:1px solid var(--card-brd);
  }
  td { font-size:12.5px; color:var(--ink); padding:8px; border-bottom:1px solid var(--card-brd); }
  .pill {
    display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px;
    font-size:11px; font-weight:600; background:var(--okbg); color:var(--ok);
  }
  .pill i { width:5px; height:5px; border-radius:50%; background:var(--ok); }
  .rfoot { margin-top:auto; padding-top:8px; font-size:11px; color:var(--faint); }

  /* ---------- 媒体信息 ---------- */
  .info { width:280px; flex:none; padding:12px 14px; display:flex; flex-direction:column; }
  .info .chead { margin-bottom:10px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .stat { background:var(--stat-bg); border-radius:10px; padding:8px 10px 7px; }
  .stat .k { font-size:10.5px; color:var(--faint); margin-bottom:2px; }
  .stat .v { font-size:13px; font-weight:700; color:var(--ink); }
  .codec { display:flex; align-items:center; gap:7px; padding-bottom:10px; border-bottom:1px solid var(--card-brd); }
  .codec .k { font-size:12px; color:var(--muted); font-weight:600; }
  .bdg { font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--soft-bg); color:var(--soft-text); }
  .bdg.plain { background:var(--stat-bg); color:var(--muted); }
  .sec { padding-top:9px; border-top:1px solid var(--card-brd); margin-top:9px; }
  .sec-h { display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--faint); letter-spacing:1px; margin-bottom:6px; }
  .cnt { font-size:10px; background:var(--stat-bg); color:var(--muted); border-radius:999px; padding:1px 6px; }
  .trk { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .tn { width:18px; height:18px; flex:none; border-radius:50%; background:var(--soft-bg); color:var(--soft-text);
        font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .trk .nm { font-size:12.5px; color:var(--ink); font-weight:600; }
  .trk .sb { font-size:11px; color:var(--faint); }
  .trk .rt { margin-left:auto; display:flex; gap:5px; }
  .mini { font-size:10.5px; font-weight:600; padding:1px 7px; border-radius:5px; background:var(--stat-bg); color:var(--muted); }
  .mini.acc { background:var(--soft-bg); color:var(--soft-text); }
  .chap { display:flex; align-items:center; gap:8px; padding:3px 0; }
  .ct { font-family:Consolas,monospace; font-size:10.5px; color:var(--muted); background:var(--stat-bg); border-radius:5px; padding:2px 6px; }
  .ctt { font-size:12px; color:var(--ink); }

  .tag {
    position:absolute; right:14px; bottom:10px; font-size:11px; font-weight:700; letter-spacing:1px;
    color:var(--faint);
  }
</style>
</head>
<body>

function navHtml() {
  return NAV.map(([icon, name], i) =>
    `<div class="ni${i === 1 ? ' on' : ''}">${ICONS[icon]}<span>${name}</span></div>`).join('');
